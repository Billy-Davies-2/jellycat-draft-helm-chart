{{- if and .Values.nats.enabled (not .Values.grpc.enabled) }}
{{- fail "gRPC must be enabled when NATS is enabled. gRPC is required for real-time chat and event streaming via NATS." }}
{{- end }}
{{- $secretBackedConfig := or .Values.auth.existingSecret .Values.externalSecrets.enabled (and .Values.auth.vault.enabled .Values.auth.vault.secretName) -}}
{{- if and (eq .Values.environment "production") (not .Values.auth.enabled) }}
{{- fail "auth.enabled must be true when environment=production because the app requires Authentik credentials in production." }}
{{- end }}
{{- if and (eq .Values.environment "production") .Values.auth.enabled (not (or .Values.auth.clientID $secretBackedConfig)) }}
{{- fail "production auth requires auth.clientID or a secret-backed client ID." }}
{{- end }}
{{- if and (eq .Values.environment "production") .Values.auth.enabled (not (or .Values.auth.clientSecret $secretBackedConfig)) }}
{{- fail "production auth requires auth.clientSecret, auth.existingSecret, externalSecrets.enabled, or auth.vault with a synced secret." }}
{{- end }}
{{- $secretName := include "jellycat-ui.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jellycat-ui.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "jellycat-ui.name" . }}
    helm.sh/chart: {{ include "jellycat-ui.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "jellycat-ui.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "jellycat-ui.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        reloader.stakater.com/auto: "true"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ include "jellycat-ui.serviceAccountName" . }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ default .Values.image.tag .Values.image.tagOverride }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
            {{- if .Values.grpc.enabled }}
            - containerPort: {{ .Values.grpc.port }}
              name: grpc
            {{- end }}
          env:
            - name: PORT
              value: "{{ .Values.service.port }}"
            {{- if .Values.grpc.enabled }}
            - name: GRPC_PORT
              value: "{{ .Values.grpc.port }}"
            {{- end }}
            {{- if .Values.environment }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- if .Values.app.publicURL }}
            - name: PUBLIC_URL
              value: {{ .Values.app.publicURL | quote }}
            {{- end }}
            {{- if .Values.app.roomCode }}
            - name: ROOM_CODE
              value: {{ .Values.app.roomCode | quote }}
            {{- end }}
            {{- if .Values.app.seedDefaultCatalog }}
            - name: JELLYCAT_SEED_DEFAULT_CATALOG
              value: {{ .Values.app.seedDefaultCatalog | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: AUTHENTIK_BASE_URL
              value: {{ .Values.auth.baseURL | quote }}
            {{- if .Values.auth.clientID }}
            - name: AUTHENTIK_CLIENT_ID
              value: {{ .Values.auth.clientID | quote }}
            {{- else if $secretBackedConfig }}
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.clientIDKey | default .Values.auth.clientIDKey | default "clientID" }}{{ else }}{{ .Values.auth.clientIDKey | default "clientID" }}{{ end }}
            {{- end }}
            {{- if .Values.auth.redirectURL }}
            - name: AUTHENTIK_REDIRECT_URL
              value: {{ .Values.auth.redirectURL | quote }}
            {{- end }}
            {{- if and .Values.auth.vault.enabled .Values.auth.vault.secretName }}
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.auth.vault.keys.clientSecret | default .Values.auth.clientSecretKey | default "clientSecret" }}
            {{- else if .Values.auth.existingSecret }}
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.auth.clientSecretKey | default "clientSecret" }}
            {{- else if .Values.externalSecrets.enabled }}
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.externalSecrets.data.clientSecretKey | default "clientSecret" }}
            {{- else if .Values.auth.clientSecret }}
            - name: AUTHENTIK_CLIENT_SECRET
              value: {{ .Values.auth.clientSecret | quote }}
            {{- end }}
            {{- if .Values.auth.adminClaim }}
            - name: AUTH_ADMIN_CLAIM
              value: {{ .Values.auth.adminClaim | quote }}
            {{- end }}
            {{- if .Values.auth.adminValue }}
            - name: AUTH_ADMIN_VALUE
              value: {{ .Values.auth.adminValue | quote }}
            {{- end }}
            {{- end }}
            # Database configuration
            {{- if .Values.db.driver }}
            - name: DB_DRIVER
              value: {{ .Values.db.driver | quote }}
            {{- end }}
            {{- if .Values.db.sqlite.file }}
            - name: SQLITE_FILE
              value: {{ .Values.db.sqlite.file | quote }}
            {{- end }}
            {{- if or .Values.db.postgres.value .Values.auth.existingSecret .Values.externalSecrets.enabled (and .Values.auth.vault.enabled .Values.auth.vault.secretName) }}
            - name: DATABASE_URL
              {{- if .Values.db.postgres.value }}
              value: {{ .Values.db.postgres.value | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.databaseUrlKey | default "DATABASE_URL" }}{{ else }}{{ .Values.db.postgres.secretKey }}{{ end }}
              {{- end }}
            {{- end }}
            - name: CLICKHOUSE_ENABLED
              value: {{ .Values.db.clickhouse.enabled | quote }}
            {{- if and .Values.db.clickhouse.enabled (or .Values.db.clickhouse.url .Values.auth.existingSecret .Values.externalSecrets.enabled (and .Values.auth.vault.enabled .Values.auth.vault.secretName)) }}
            - name: CLICKHOUSE_ADDR
              {{- if .Values.db.clickhouse.url }}
              value: {{ .Values.db.clickhouse.url | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.clickhouseAddrKey | default "CLICKHOUSE_ADDR" }}{{ else }}{{ .Values.db.clickhouse.addrSecretKey }}{{ end }}
              {{- end }}
            {{- end }}
            {{- if .Values.db.clickhouse.database }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.db.clickhouse.database | quote }}
            {{- end }}
            {{- if and .Values.db.clickhouse.enabled (or .Values.auth.existingSecret .Values.externalSecrets.enabled (and .Values.auth.vault.enabled .Values.auth.vault.secretName)) }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.clickhouseUserKey | default "CLICKHOUSE_USER" }}{{ else }}{{ .Values.db.clickhouse.userSecretKey }}{{ end }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.clickhousePasswordKey | default "CLICKHOUSE_PASSWORD" }}{{ else }}{{ .Values.db.clickhouse.passwordSecretKey }}{{ end }}
            {{- end }}
            # NATS configuration
            {{- if .Values.nats.enabled }}
            {{- if or .Values.nats.url .Values.auth.existingSecret .Values.externalSecrets.enabled (and .Values.auth.vault.enabled .Values.auth.vault.secretName) }}
            - name: NATS_URL
              {{- if .Values.nats.url }}
              value: {{ .Values.nats.url | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.natsUrlKey | default "NATS_URL" }}{{ else }}{{ .Values.nats.urlSecretKey }}{{ end }}
              {{- end }}
            {{- end }}
            {{- if or .Values.nats.subject .Values.auth.existingSecret .Values.externalSecrets.enabled (and .Values.auth.vault.enabled .Values.auth.vault.secretName) }}
            - name: NATS_SUBJECT
              {{- if .Values.nats.subject }}
              value: {{ .Values.nats.subject | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.natsSubjectKey | default "NATS_SUBJECT" }}{{ else }}{{ .Values.nats.subjectSecretKey }}{{ end }}
              {{- end }}
            {{- end }}
            {{- if and .Values.nats.authFromSecret (or .Values.auth.existingSecret .Values.externalSecrets.enabled (and .Values.auth.vault.enabled .Values.auth.vault.secretName)) }}
            - name: NATS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.natsUsernameKey | default "NATS_USERNAME" }}{{ else }}{{ .Values.nats.usernameSecretKey }}{{ end }}
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.natsPasswordKey | default "NATS_PASSWORD" }}{{ else }}{{ .Values.nats.passwordSecretKey }}{{ end }}
            - name: NATS_CREDS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ if .Values.externalSecrets.enabled }}{{ .Values.externalSecrets.data.natsCredsKey | default "NATS_CREDS" }}{{ else }}{{ .Values.nats.credsSecretKey }}{{ end }}
            {{- end }}
            {{- end }}
          {{- with .Values.extraEnv }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.auth.caSecretName (and .Values.auth.vault.enabled .Values.auth.vault.secretProviderClassName) }}
          volumeMounts:
            {{- if .Values.auth.caSecretName }}
            - name: auth-ca
              mountPath: /etc/ssl/certs
            {{- end }}
            {{- if and .Values.auth.vault.enabled .Values.auth.vault.secretProviderClassName }}
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.auth.caSecretName (and .Values.auth.vault.enabled .Values.auth.vault.secretProviderClassName) }}
      volumes:
        {{- if .Values.auth.caSecretName }}
        - name: auth-ca
          secret:
            secretName: {{ .Values.auth.caSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if and .Values.auth.vault.enabled .Values.auth.vault.secretProviderClassName }}
        - name: vault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.auth.vault.secretProviderClassName }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
