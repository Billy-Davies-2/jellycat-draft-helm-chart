{{- if and .Values.auth.enabled (not .Values.auth.vault.enabled) (not .Values.auth.existingSecret) (not .Values.externalSecrets.enabled) .Values.auth.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jellycat-ui.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "jellycat-ui.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.auth.clientSecretKey | default "clientSecret" }}: {{ .Values.auth.clientSecret | quote }}
{{- end }}
